services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: uber_like
      POSTGRES_USER: uber_like
      POSTGRES_PASSWORD: uber_like_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uber_like -d uber_like"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://uber_like:uber_like_dev@postgres:5432/uber_like?sslmode=disable
      HTTP_ADDR: :8080
      RESERVATION_TTL_SECONDS: 300
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
